<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Action Banner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="banner">
        <p class="text">
            Get 20% OFF on Your First Order!
        </p>

        <div class="right">
            <button class="claim_btn">Claim Offer</button>
            <button class="cancel_btn">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect y="12.532" width="17.498" height="2.1" rx="1.05" transform="rotate(-45.74 0 12.532)"
                        fill="#fff" />
                    <rect x="12.533" y="13.915" width="17.498" height="2.1" rx="1.05"
                        transform="rotate(-135.74 12.533 13.915)" fill="#fff" />
                </svg>
            </button>
        </div>
    </header>
</body>

</html>
