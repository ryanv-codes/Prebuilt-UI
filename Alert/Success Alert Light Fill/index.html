<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Success Alert Light Fill</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="success_alert">
        <div class="blue"></div>
        <div class="text">
            <svg width="20" height="20" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" class="icon line">
                <path style="fill:none;stroke:#155dfc;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.95"
                    d="M11.95 16.5h.1" />
                <path d="M3 12a9 9 0 0 1 9-9h0a9 9 0 0 1 9 9h0a9 9 0 0 1-9 9h0a9 9 0 0 1-9-9m9 0V7"
                    style="fill:none;stroke:#155dfc;stroke-linecap:round;stroke-linejoin:round;stroke-width:1.5" />
            </svg>
            <p>Success! Your task is fully completed.</p>
        </div>
        <button>
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M15 5L5 15M5 5L15 15" stroke="#155dfc" stroke-width="1.7" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </button>
    </div>
</body>

</html>
