<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error Alert Badge</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="alert_badge">
        <div class="msg_icon">
            <svg width="18" height="16" viewBox="0 0 20 18" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path
                    d="M10 6.5v3.334m0 3.333h.008M8.575 2.217 1.516 14a1.666 1.666 0 0 0 1.425 2.5h14.117a1.667 1.667 0 0 0 1.425-2.5L11.425 2.217a1.667 1.667 0 0 0-2.85 0"
                    stroke="#fff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <p>Action failed!</p>
        </div>

        <p id="msg-text">Something went wrong, please try again!</p>
</body>

</html>
