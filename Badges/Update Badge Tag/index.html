<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Badge Tag</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="update_badge">
        <p class="update_text">
            It will take approximate 2GB memory
        </p>

        <button id="update-btn">
            Update
            <svg width="14" height="11" viewBox="0 0 16 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M1 6.5h14M9.5 1 15 6.5 9.5 12" stroke="#fff" stroke-width="1.5" stroke-linecap="round"
                    stroke-linejoin="round" />
            </svg>
        </button>
    </div>
</body>

</html>
